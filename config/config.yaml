# Put your plugin configuration here

imports:
    - { resource: "twig_hooks/**/*.yaml" }

gewebe_sylius_vat:
    order:
        recalculate: true
    required:
        default: false
        company: false
        countries: []
    revalidate:
        on_login: true
        expiration_days: 30
    hmrc:
        base_url: 'https://api.service.hmrc.gov.uk'
        client_id: null
        client_secret: null
    validate:
        format: true
        country: true
        registration: true
        on_service_unavailable: false
